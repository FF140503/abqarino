<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة عمليات عبقرينو 🧠</title>
    <style>
        body { background: #0c101b; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { margin-bottom: 30px; }
        .chart-box { background: #131722; padding: 15px; border-radius: 12px; height: 500px; border: 1px solid #2a2e39; }
        .tweet-box { margin-top: 30px; }
        .tweet-box img { max-width: 100%; border-radius: 10px; border: 2px solid #2962ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>غرفة عمليات عبقرينو 🧠</h1>
            <p>المؤشرات الحية | تحليل السيولة | متابعة لحظية</p>
        </div>
        
        <div class="chart-box">
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({"autosize": true, "symbol": "CAPITALCOM:SPX500", "theme": "dark", "style": "1", "locale": "ar", "container_id": "tv_chart"});
            </script>
            <div id="tv_chart" style="height: 100%;"></div>
        </div>

        <div class="tweet-box">
            <h3>أحدث توصية أو تحليل:</h3>
            <img src="https://via.placeholder.com/600x300?text=يرجى+رفع+صورة+التغريدة+هنا" alt="تغريدة">
        </div>
    </div>
</body>
</html>
