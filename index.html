<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة عمليات عبقرينو | SPX500</title>
    <style>
        :root {
            --bg: #0c101b;
            --card: #131722;
            --border: #2a2e39;
            --text: #d1d4dc;
            --primary: #2962ff;
        }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* قسم المؤشر */
        .chart-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
        }

        /* قسم التغريدة المرفوعة */
        .tweet-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .tweet-section h2 { color: #fff; margin-bottom: 15px; font-size: 1.2rem; }
        .tweet-section img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="chart-section">
        <div class="tradingview-widget-container" style="height: 500px;">
            <div id="tradingview_spx" style="height: 100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "CAPITALCOM:SPX500", 
                "interval": "D",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "container_id": "tradingview_spx"
            });
            </script>
        </div>
    </div>

    <div class="tweet-section">
        <h2>تحديثات البروفيسور عبقرينو 🧠</h2>
        <img src="رابط_صورتك_هنا.jpg" alt="تغريدة عبقرينو">
    </div>
</div>

</body>
</html>
