<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1525;
    --card: #131a2e;
    --border: #1e2d4a;
    --red: #ff3b5c;
    --green: #00d68f;
    --gold: #f5a623;
    --blue: #3d9cf5;
    --text: #e8eaf0;
    --muted: #7a8ba8;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Cairo', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 340px;
    height: 340px;
    background: radial-gradient(circle, rgba(61,156,245,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #1a2540, #0f1a30);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 16px;
    font-size: 11px;
    color: var(--blue);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: 'Cairo', sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 5vw, 36px);
    line-height: 1.2;
    background: linear-gradient(135deg, #fff 30%, var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .sub {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }
  .live-price {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 18px;
    margin-top: 14px;
    font-size: 18px;
    font-weight: 700;
    color: var(--green);
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.4;transform:scale(1.5)}
  }

  /* CHART VISUAL */
  .chart-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 20px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .chart-section::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at top right, rgba(255,59,92,0.07), transparent 70%);
    pointer-events: none;
  }
  .section-title {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title span {
    display: inline-block;
    width: 18px;
    height: 2px;
    background: var(--blue);
    border-radius: 2px;
  }

  /* SVG CHART */
  .svg-wrap {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }
  svg { width: 100%; height: auto; display: block; }

  /* WAVES LEGEND */
  .waves-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .wave-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
    transition: transform .2s, border-color .2s;
    animation: fadeUp .5s ease both;
  }
  .wave-card:hover {
    transform: translateY(-3px);
    border-color: var(--blue);
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .wave-card:nth-child(1){animation-delay:.1s}
  .wave-card:nth-child(2){animation-delay:.2s}
  .wave-card:nth-child(3){animation-delay:.3s}
  .wave-card:nth-child(4){animation-delay:.4s}
  .wave-card:nth-child(5){animation-delay:.5s}
  .wave-card:nth-child(6){animation-delay:.6s}

  .wave-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    line-height: 1;
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: .08;
  }
  .wave-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .wave-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .wave-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .wave-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    margin-top: 6px;
  }

  /* SCENARIOS */
  .scenarios {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .scenario-card {
    border-radius: 16px;
    padding: 18px 16px;
    animation: fadeUp .5s ease both;
  }
