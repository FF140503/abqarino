<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة عمليات عبقرينو 🧠</title>
    <style>
        body { background: #0c101b; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: #131722; padding: 15px; border-radius: 12px; border: 1px solid #2a2e39; }
        .chart-box { height: 400px; }
        .clock-box { text-align: center; }
        .clock { font-size: 1.2rem; margin: 10px 0; color: #38bdf8; }
        .tweet-section { margin-top: 20px; text-align: center; }
        .tweet-section img { max-width: 100%; border-radius: 8px; border: 2px solid #2962ff; }
        .footer-ticker { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>يوميات عبقرينو التحليلية 🧠</h1></div>

        <div class="grid-layout">
            <div class="box chart-box">
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget({"autosize": true, "symbol": "CAPITALCOM:SPX500", "theme": "dark", "style": "1", "locale": "ar", "container_id": "tv_chart"});
                </script>
                <div id="tv_chart" style="height: 100%;"></div>
            </div>

            <div class="box clock-box">
                <h3>توقيت الأسواق العالمية</h3>
                <div>السعودية: <span class="clock" id="sa-time"></span></div>
                <div>لندن: <span class="clock" id="london-time"></span></div>
                <div>نيويورك: <span class="clock" id="ny-time"></span></div>
                <div>آسيا (طوكيو): <span class="clock" id="tokyo-time"></span></div>
            </div>
        </div>

        <div class="tweet-section">
            <h3>تحليل اليوم</h3>
            <img src="رابط_صورتك_هنا" alt="ضع رابط صورتك هنا">
        </div>

        <div class="footer-ticker">شريط نصائح للمتداولين: التزم بالخطة، ولا تلاحق السعر!</div>
    </div>

    <script>
        function updateClocks() {
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('sa-time').innerText = new Date().toLocaleTimeString('ar-SA', {timeZone: 'Asia/Riyadh', ...options});
            document.getElementById('london-time').innerText = new Date().toLocaleTimeString('ar-SA', {timeZone: 'Europe/London', ...options});
            document.getElementById('ny-time').innerText = new Date().toLocaleTimeString('ar-SA', {timeZone: 'America/New_York', ...options});
            document.getElementById('tokyo-time').innerText = new Date().toLocaleTimeString('ar-SA', {timeZone: 'Asia/Tokyo', ...options});
        }
        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>
</html>
